{% extends "base.html" %}
{% block content %}

<h2 style="font-size: 1.3rem; font-weight: normal; margin-bottom: 2rem;">
    Compose a sealed message
</h2>

<form method="POST" action="/compose">
  <div style="margin-bottom: 1.5rem;">
    <label style="display: block; font-size: 0.85rem; color: #555; margin-bottom: 0.4rem;">
      Your email address
    </label>
    <input type="email" name="sender_email" required style="
        width: 100%; padding: 0.7rem;
        border: 1px solid #ccc; background: #fff;
        font-size: 1rem; font-family: inherit;
    ">
  </div>

  <div style="margin-bottom: 1.5rem;">
    <label style="display: block; font-size: 0.85rem; color: #555; margin-bottom: 0.4rem;">
      Recipient email address
    </label>
    <input type="email" name="recipient_email" required style="
        width: 100%; padding: 0.7rem;
        border: 1px solid #ccc; background: #fff;
        font-size: 1rem; font-family: inherit;
    ">
  </div>

  <div style="margin-bottom: 1.5rem;">
    <label style="display: block; font-size: 0.85rem; color: #555; margin-bottom: 0.4rem;">
      Deliver on
    </label>
    <input type="date" name="deliver_at" required style="
        width: 100%; padding: 0.7rem;
        border: 1px solid #ccc; background: #fff;
        font-size: 1rem; font-family: inherit;
    ">
  </div>

  <div style="margin-bottom: 2rem;">
    <label style="display: block; font-size: 0.85rem; color: #555; margin-bottom: 0.4rem;">
      Message
    </label>
    <textarea name="message" rows="10" required style="
        width: 100%; padding: 0.7rem;
        border: 1px solid #ccc; background: #fff;
        font-size: 1rem; font-family: inherit;
        resize: vertical;
    "></textarea>
  </div>

  <p style="font-size: 0.8rem; color: #999; margin-bottom: 1.5rem;">
    Once you submit this message, it cannot be retrieved, modified, or deleted.
  </p>

  <button type="submit" style="
      background: #1a1a1a; color: #f5f4f0;
      border: none; padding: 0.9rem 2rem;
      font-size: 0.95rem; font-family: inherit;
      cursor: pointer; letter-spacing: 0.03em;
  ">
      Seal and send →
  </button>
</form>

{% endblock %}
