services:
  - type: web
    name: sealedmail
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sealedmail-db
          property: connectionString

databases:
  - name: sealedmail-db
    plan: free
